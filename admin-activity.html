<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity — WebXRIDE Admin</title>
    <link rel="stylesheet" href="admin-nav.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #333;
        max-width: 1200px;
      }
      h1 { margin-bottom: 4px; }
      h2 { margin: 18px 0 8px; font-size: 1.05em; }
      .hint { color: #666; font-size: 14px; margin-bottom: 16px; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar select, .toolbar button {
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 13px;
      }
      .toolbar button {
        background: #007bff;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .toolbar button.secondary { background: #6c757d; }
      .toolbar button.tab {
        background: #e9ecef;
        color: #333;
      }
      .toolbar button.tab.active {
        background: #0d6efd;
        color: #fff;
      }
      .meta { font-size: 13px; color: #666; margin-bottom: 10px; }
      .status { font-size: 13px; margin-left: 4px; }
      .status.err { color: #dc3545; }
      .status.ok { color: #198754; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        font-size: 13px;
      }
      th, td {
        border: 1px solid #dee2e6;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      th { background: #f8f9fa; }
      tr:nth-child(even) { background: #fafafa; }
      .code { font-family: monospace; font-size: 12px; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
      }
      .badge-login { background: #d1e7dd; color: #0f5132; }
      .badge-logout { background: #e2e3e5; color: #41464b; }
      .badge-draft { background: #cff4fc; color: #055160; }
      .badge-submitted { background: #d1e7dd; color: #0f5132; }
      .badge-asset { background: #fff3cd; color: #664d03; }
      .empty { color: #666; padding: 24px; background: #f8f9fa; border-radius: 8px; }
      button.linkish {
        background: none;
        border: none;
        padding: 0;
        color: #0d6efd;
        cursor: pointer;
        text-decoration: underline;
        font: inherit;
        text-align: left;
      }
      button.linkish:hover { color: #0a58ca; }
      .warn {
        background: #fff3cd;
        border: 1px solid #ffecb5;
        color: #856404;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 14px;
      }
      .section { display: none; }
      .section.visible { display: block; }
    </style>
    <script src="admin-auth-ui.js"></script>
    <script src="admin-nav.js"></script>
  </head>
  <body>
    <div id="login-root"></div>
    <div id="activity-app" style="display: none">
      <nav id="admin-nav" data-active="activity"></nav>
      <h1>Activity</h1>
      <p class="hint">
        Login/logout timestamps and cloud upload events (package or asset file totals).
        Logout is recorded only on explicit logout — closing a tab or cookie expiry is not logged.
      </p>

      <div class="toolbar">
        <label>
          Time window
          <select id="days">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </label>
        <button type="button" class="tab active" data-tab="all">All</button>
        <button type="button" class="tab" data-tab="logins">Logins</button>
        <button type="button" class="tab" data-tab="logouts">Logouts</button>
        <button type="button" class="tab" data-tab="uploads">Uploads</button>
        <label id="kind-wrap" style="display: none">
          Upload kind
          <select id="kind">
            <option value="">All kinds</option>
            <option value="draft">draft</option>
            <option value="submitted">submitted</option>
            <option value="asset">asset</option>
          </select>
        </label>
        <button type="button" id="btn-refresh">Refresh</button>
        <span id="status" class="status"></span>
      </div>

      <div id="db-warn" class="warn" style="display: none">
        DATABASE_URL is not set — activity history will not persist.
      </div>
      <div id="meta" class="meta"></div>

      <div id="section-auth" class="section visible">
        <h2>Logins &amp; logouts</h2>
        <div id="auth-table"></div>
      </div>

      <div id="section-uploads" class="section visible">
        <h2>Uploads</h2>
        <div id="uploads-table"></div>
      </div>
    </div>
    <script src="admin-activity.js"></script>
  </body>
</html>
