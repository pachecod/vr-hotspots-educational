<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Error Log — WebXRIDE Admin</title>
    <link rel="stylesheet" href="admin-nav.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #333;
        max-width: 1200px;
      }
      h1 { margin-bottom: 4px; }
      .hint { color: #666; font-size: 14px; margin-bottom: 16px; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar select, .toolbar button {
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 13px;
      }
      .toolbar button {
        background: #007bff;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .toolbar button.secondary { background: #6c757d; }
      .toolbar button.danger { background: #dc3545; }
      .meta { font-size: 13px; color: #666; margin-bottom: 10px; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        font-size: 13px;
      }
      th, td {
        border: 1px solid #dee2e6;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      th { background: #f8f9fa; }
      tr:nth-child(even) { background: #fafafa; }
      .level {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
      }
      .level-error { background: #f8d7da; color: #721c24; }
      .level-warning { background: #fff3cd; color: #856404; }
      .level-info { background: #d1ecf1; color: #0c5460; }
      .code { font-family: monospace; font-size: 12px; }
      .msg { max-width: 420px; }
      details summary { cursor: pointer; color: #007bff; }
      pre {
        margin: 8px 0 0;
        padding: 8px;
        background: #f1f3f5;
        border-radius: 4px;
        overflow: auto;
        max-height: 220px;
        font-size: 11px;
      }
      .empty { color: #666; padding: 24px; background: #f8f9fa; border-radius: 8px; }
      .status { font-size: 13px; margin-left: 8px; }
      .status.err { color: #dc3545; }
    </style>
    <script src="admin-auth-ui.js"></script>
    <script src="admin-nav.js"></script>
  </head>
  <body>
    <div id="app-root">
      <div id="login-root"></div>
      <div id="main-content" style="display: none">
        <nav id="admin-nav" data-active="errors"></nav>

        <h1>Error Log</h1>
        <p class="hint">
          Generic client/server error reports for this instance. Timestamps are shown in Eastern Time
          (EDT/EST). Includes integrity checks such as cross-scene hotspot cloning.
        </p>

        <div class="toolbar">
          <label>
            Level
            <select id="filter-level">
              <option value="">All</option>
              <option value="error">Error</option>
              <option value="warning">Warning</option>
              <option value="info">Info</option>
            </select>
          </label>
          <label>
            Code
            <select id="filter-code">
              <option value="">All</option>
              <option value="duplicate_hotspot_layouts">duplicate_hotspot_layouts</option>
              <option value="unhandled_error">unhandled_error</option>
              <option value="unhandled_rejection">unhandled_rejection</option>
              <option value="client_error">client_error</option>
            </select>
          </label>
          <button type="button" id="refresh-btn">Refresh</button>
          <button type="button" class="secondary" id="clear-old-btn">Clear older than 30 days</button>
          <button type="button" class="danger" id="clear-all-btn">Clear all</button>
          <span id="status" class="status"></span>
        </div>
        <div class="meta" id="list-meta"></div>
        <div id="log-root"></div>
      </div>
    </div>
    <script src="admin-error-log.js"></script>
  </body>
</html>
