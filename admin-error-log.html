<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Error Log — WebXRIDE Admin</title>
    <link rel="stylesheet" href="admin-nav.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #333;
        max-width: 1200px;
      }
      h1 { margin-bottom: 4px; }
      .hint { color: #666; font-size: 14px; margin-bottom: 16px; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar select, .toolbar button {
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 13px;
      }
      .toolbar button {
        background: #007bff;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .toolbar button.secondary { background: #6c757d; }
      .toolbar button.danger { background: #dc3545; }
      .meta { font-size: 13px; color: #666; margin-bottom: 10px; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        font-size: 13px;
      }
      th, td {
        border: 1px solid #dee2e6;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      th { background: #f8f9fa; }
      tr:nth-child(even) { background: #fafafa; }
      .level {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
      }
      .level-error { background: #f8d7da; color: #721c24; }
      .level-warning { background: #fff3cd; color: #856404; }
      .level-info { background: #d1ecf1; color: #0c5460; }
      .code { font-family: monospace; font-size: 12px; }
      .msg { max-width: 420px; }
      details summary { cursor: pointer; color: #007bff; }
      pre {
        margin: 8px 0 0;
        padding: 8px;
        background: #f1f3f5;
        border-radius: 4px;
        overflow: auto;
        max-height: 220px;
        font-size: 11px;
      }
      .empty { color: #666; padding: 24px; background: #f8f9fa; border-radius: 8px; }
      .status { font-size: 13px; margin-left: 8px; }
      .status.err { color: #dc3545; }
      .pager {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 10px 0;
        font-size: 13px;
        color: #555;
      }
      .pager button {
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background: #f8f9fa;
        cursor: pointer;
        font-size: 13px;
      }
      .pager button:hover:not(:disabled) { background: #e9ecef; }
      .pager button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pager .pager-range { color: #333; }
    </style>
    <script src="admin-auth-ui.js"></script>
    <script src="admin-nav.js"></script>
  </head>
  <body>
    <div id="app-root">
      <div id="login-root"></div>
      <div id="main-content" style="display: none">
        <nav id="admin-nav" data-active="errors"></nav>

        <h1>Error Log</h1>
        <p class="hint">
          Generic client/server error reports for this instance. Timestamps are shown in Eastern Time
          (EDT/EST). Includes integrity checks such as cross-scene hotspot cloning.
        </p>

        <div class="toolbar">
          <label>
            Level
            <select id="filter-level">
              <option value="">All</option>
              <option value="error">Error</option>
              <option value="warning">Warning</option>
              <option value="info">Info</option>
            </select>
          </label>
          <label>
            Code
            <select id="filter-code">
              <option value="">All</option>
              <option value="duplicate_hotspot_layouts">duplicate_hotspot_layouts</option>
              <option value="unhandled_error">unhandled_error</option>
              <option value="unhandled_rejection">unhandled_rejection</option>
              <option value="client_error">client_error</option>
              <option value="cloud_submit_failed">cloud_submit_failed</option>
              <option value="b2_direct_upload_failed">b2_direct_upload_failed</option>
              <option value="b2_upload_meta_orphan">b2_upload_meta_orphan</option>
              <option value="prepare_upload_failed">prepare_upload_failed</option>
              <option value="local_persist_quota">local_persist_quota</option>
              <option value="idb_media_save_failed">idb_media_save_failed</option>
              <option value="scene_video_load_failed">scene_video_load_failed</option>
              <option value="scene_video_missing_source">scene_video_missing_source</option>
              <option value="scene_panorama_load_failed">scene_panorama_load_failed</option>
              <option value="video_texture_bind_failed">video_texture_bind_failed</option>
              <option value="hotspot_media_load_failed">hotspot_media_load_failed</option>
              <option value="rehydrate_media_incomplete">rehydrate_media_incomplete</option>
              <option value="scene_video_server_upload_fallback">scene_video_server_upload_fallback</option>
              <option value="editor_video_compress_failed">editor_video_compress_failed</option>
              <option value="mov_transcode_unavailable">mov_transcode_unavailable</option>
              <option value="video_transcode_store_original">video_transcode_store_original</option>
              <option value="session_required_mid_flow">session_required_mid_flow</option>
              <option value="cloud_write_auth_denied">cloud_write_auth_denied</option>
              <option value="b2_upload_url_failed">b2_upload_url_failed</option>
              <option value="export_zip_failed">export_zip_failed</option>
              <option value="export_asset_missing">export_asset_missing</option>
              <option value="vr_cloud_publish_failed">vr_cloud_publish_failed</option>
              <option value="vr_cloud_preview_expired">vr_cloud_preview_expired</option>
              <option value="flat_page_publish_failed">flat_page_publish_failed</option>
              <option value="flat_page_b2_upload_failed">flat_page_b2_upload_failed</option>
              <option value="student_asset_upload_failed">student_asset_upload_failed</option>
              <option value="usage_quota_blocked">usage_quota_blocked</option>
              <option value="local_project_save_failed">local_project_save_failed</option>
              <option value="local_project_open_failed">local_project_open_failed</option>
              <option value="local_project_rename_failed">local_project_rename_failed</option>
              <option value="local_project_delete_failed">local_project_delete_failed</option>
              <option value="zip_template_load_failed">zip_template_load_failed</option>
              <option value="scene_add_image_failed">scene_add_image_failed</option>
              <option value="scene_add_image_url_failed">scene_add_image_url_failed</option>
              <option value="scene_add_video_failed">scene_add_video_failed</option>
              <option value="scene_replace_video_failed">scene_replace_video_failed</option>
              <option value="hotspot_video_process_failed">hotspot_video_process_failed</option>
              <option value="hotspot_video_edit_failed">hotspot_video_edit_failed</option>
              <option value="scenes_data_load_failed">scenes_data_load_failed</option>
              <option value="flat_page_load_failed">flat_page_load_failed</option>
              <option value="flat_page_persist_failed">flat_page_persist_failed</option>
              <option value="flat_page_zip_read_failed">flat_page_zip_read_failed</option>
              <option value="flat_pages_from_template_failed">flat_pages_from_template_failed</option>
              <option value="export_flat_pages_failed">export_flat_pages_failed</option>
              <option value="export_prepare_failed">export_prepare_failed</option>
            </select>
          </label>
          <label>
            Rows per page
            <select id="page-size">
              <option value="50" selected>50</option>
              <option value="100">100</option>
              <option value="150">150</option>
              <option value="200">200</option>
              <option value="all">All</option>
            </select>
          </label>
          <button type="button" id="refresh-btn">Refresh</button>
          <button type="button" class="secondary" id="download-json-btn">Download all shown</button>
          <button type="button" class="secondary" id="clear-old-btn">Clear older than 30 days</button>
          <button type="button" class="danger" id="clear-all-btn">Clear all</button>
          <span id="status" class="status"></span>
        </div>
        <div class="meta" id="list-meta"></div>
        <div id="log-pager" class="pager" style="display:none"></div>
        <div id="log-root"></div>
        <div id="log-pager-bottom" class="pager" style="display:none"></div>
      </div>
    </div>
    <script src="admin-error-log.js?v=5"></script>
  </body>
</html>
