<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hosted Pages — WebXRIDE Admin</title>
    <link rel="stylesheet" href="admin-nav.css" />
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; max-width: 1100px; }
      .panel { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
      .intro { color: #555; margin-top: 0; line-height: 1.5; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
      th { font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }
      .class-name { font-weight: bold; }
      .class-link { display: block; margin-top: 4px; font-size: 12px; color: #6c757d; word-break: break-all; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; background: #e9ecef; font-size: 13px; }
      .badge-ok { background: #e6f4ea; color: #1e6b34; }
      .badge-warn { background: #fff4e0; color: #8a5300; }
      .actions { white-space: nowrap; }
      .btn { display: inline-block; padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; text-decoration: none; margin-right: 6px; }
      .btn-primary { background: #0056b3; color: #fff; }
      .btn-secondary { background: #6c757d; color: #fff; }
      .empty, .error { color: #666; }
      .error { color: #dc3545; }
      @media (max-width: 700px) {
        th:nth-child(2), td:nth-child(2) { display: none; }
        .actions { white-space: normal; }
      }
    </style>
    <script src="admin-auth-ui.js"></script>
    <script src="admin-nav.js"></script>
  </head>
  <body>
    <div id="admin-gate"></div>
    <div id="admin-content" style="display:none;">
      <nav id="admin-nav" data-active="hosted"></nav>
      <div class="panel">
        <h2>Hosted pages</h2>
        <p class="intro">
          Each team or class has its own public gallery of the hosted pages you feature in
          <a href="admin-submissions.html">Submissions</a> (<strong>Feature on Hosted List</strong>).
          Visitors need the classroom password; as a signed-in admin you are let in automatically.
        </p>
        <div id="hosted-classes"><p class="empty">Loading…</p></div>
      </div>
    </div>

    <script src="admin-hosted-pages.js"></script>
  </body>
</html>
