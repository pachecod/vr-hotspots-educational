# Render Blueprint — WebXRIDE / VR Hotspots Educational
# https://render.com/docs/blueprint-spec
#
# Build: `npm install` only. flat-editor.bundle.js is committed; do not run
# `npm run build:flat-editor` here — Vite is a devDependency and fails on
# Render with exit 127 when NODE_ENV=production.
#
# Guest mode + welcome-screen samples are enabled by default below.
# 360° video pipeline: transcode + student server upload + URL export (see ROLLBACK_VIDEO.md).
# Enter B2 and admin secrets when the blueprint prompts (sync: false).
databases:
  - name: vr-hotspots-2-0-db
    plan: free

services:
  - type: web
    name: vr-hotspots-educational-2-0
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vr-hotspots-2-0-db
          property: connectionString
      - key: STUDENT_AUTH_REQUIRED
        value: "true"
      - key: LOCAL_TEST_USER_ENABLED
        value: "true"
      - key: LOCAL_TEST_USER_ALLOW_PRODUCTION
        value: "true"
      - key: PUBLIC_PLAYGROUND_ENABLED
        value: "true"
      - key: SITE_PASSWORD
        sync: false
      - key: SITE_PASSWORD_SECRET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_BUCKET_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: STUDENT_SESSION_SECRET
        sync: false
      - key: STUDENT_PASSWORD_ENCRYPTION_SECRET
        sync: false
      # Optional: separate origin for /hosted/* (e.g. https://hosted.webxride.com)
      - key: HOSTED_ORIGIN
        sync: false
      - key: SERVER_BASE_URL
        sync: false
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_CLASS
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: VIDEO_TRANSCODE_ENABLED
        value: "true"
      - key: VIDEO_TRANSCODE_ADMIN_ONLY
        value: "false"
      - key: VIDEO_SCENE_SERVER_UPLOAD
        value: "true"
      - key: VIDEO_EXPORT_URL_MODE
        value: "true"
      - key: GOOGLE_ANALYTICS_MEASUREMENT_ID
        sync: false
      # Admin → Usage: GA4 Data API (property id + service account JSON)
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false
      # Admin → Usage & Infra: Render Metrics API (Account Settings → API Keys)
      - key: RENDER_API_KEY
        sync: false
      # Optional B2 storage ceiling for Usage dashboard max-line (GB)
      - key: USAGE_B2_MAX_GB
        sync: false
      # Optional B2 daily download ceiling for Usage dashboard (GB, GMT day)
      - key: USAGE_B2_DOWNLOAD_MAX_GB
        sync: false
# deploy-trigger: 2026-08-06T20:45Z branch 3.8 security hardening
