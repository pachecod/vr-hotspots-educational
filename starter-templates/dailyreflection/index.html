<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Reflection Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="journal" id="journal-root">
    <header class="journal-header">
      <h1 id="journal-title">Daily Reflection Journal</h1>
      <p id="journal-subtitle" class="journal-subtitle"></p>
    </header>
    <div id="journal-entries" class="journal-entries" aria-live="polite"></div>
    <p id="journal-error" class="journal-error" hidden></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
